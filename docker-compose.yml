services:
  extractor:
    build: .
    image: linkedin-post-extractor:latest
    container_name: linkedin-post-extractor
    ports:
      # Web Console UI accessible at http://localhost:8000
      - "8000:8000"
    volumes:
      # Mount outputs to host so exported files and session.json persist locally
      - ./outputs:/app/outputs
    env_file:
      - .env
    restart: unless-stopped
