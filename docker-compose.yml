services:
  extractor:
    build: .
    image: linkedin-post-extractor:latest
    container_name: linkedin-post-extractor
    ports:
      # Web Console UI accessible at http://localhost:8000
      - "8000:8000"
    volumes:
      # Mount outputs to host so exported Excel/CSV/JSON appear locally
      - ./outputs:/app/outputs
      # Mount session.json if present
      - ./session.json:/app/session.json:ro
    env_file:
      - .env
    restart: unless-stopped
