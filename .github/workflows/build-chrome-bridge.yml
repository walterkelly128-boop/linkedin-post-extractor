name: Build Windows Chrome Bridge

on:
  workflow_dispatch:
  push:
    paths:
      - "bridge_server.py"
      - "bridge_requirements.txt"
      - "chrome_bridge.spec"
      - "src/**"
      - ".github/workflows/build-chrome-bridge.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r bridge_requirements.txt
          python -m pip install pyinstaller

      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm chrome_bridge.spec
          if (-not (Test-Path "dist\chrome-bridge.exe")) { throw "dist\chrome-bridge.exe 未生成" }

      - name: Verify EXE
        shell: pwsh
        run: |
          $file = Get-Item "dist\chrome-bridge.exe"
          Write-Host "EXE: $($file.FullName)"
          Write-Host "Size: $($file.Length) bytes"
          if ($file.Length -lt 1000000) { throw "EXE 文件异常过小" }

      - name: Package ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package -Force | Out-Null
          Copy-Item "dist\chrome-bridge.exe" "package\chrome-bridge.exe"
          Copy-Item "start_chrome_bridge.ps1" "package\start_chrome_bridge.ps1"
          Copy-Item "BRIDGE_WINDOWS.md" "package\BRIDGE_WINDOWS.md"
          Compress-Archive -Path "package\*" -DestinationPath "chrome-bridge-windows.zip" -Force

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrome-bridge-windows
          path: dist/chrome-bridge.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload complete package
        uses: actions/upload-artifact@v4
        with:
          name: chrome-bridge-windows-package
          path: chrome-bridge-windows.zip
          if-no-files-found: error
          retention-days: 30
